<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygon Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <!-- same structure as before -->
    <div class="container">
        <h1>Polygon Editor</h1>

        <div class="top-section">
             <div class="bounds-inputs" style="margin-bottom: 15px; display: flex; gap: 15px; flex-wrap: wrap;">
    		<div>
        		<label>X min (m):</label><br>
        		<input type="number" id="xmin" step="any" value="0" style="width: 100px;">
    		</div>
    		<div>
        		<label>X max (m):</label><br>
        		<input type="number" id="xmax" step="any" value="5000" style="width: 100px;">
    		</div>
    		<div>
        		<label>Y min (m):</label><br>
        		<input type="number" id="ymin" step="any" value="0" style="width: 100px;">
    		</div>
    	   	<div>
        		<label>Y max (m):</label><br>
        		<input type="number" id="ymax" step="any" value="1000" style="width: 100px;">
    		</div>
    		<button onclick="applyBounds()" style="align-self: flex-end; margin-top: 22px;">Apply</button>
	     </div>
	     <button onclick="calculateMagResponse()">Calculate Mag</button>
	     <div id="calcStatus" style="margin-top: 8px; color: #0f0; font-size: 0.9em; min-height: 20px;"></div>
	</div>
	
	<!-- Upper canvas + Load CSV button -->
<div style="display: flex; justify-content: center; align-items: flex-start; gap: 20px; margin: 20px 0; flex-wrap: wrap;">
    <div style="text-align: center;">
        <h3 style="margin: 8px 0 4px;">Magnetics Plot</h3>
	  <div style="margin-top: 10px;">
            <button onclick="loadPlotCSV()" style="padding: 8px 16px; font-size: 1em;"> Load data </button>
        </div>

        <canvas id="plotCanvas" width="800" height="220" 
                style="border: 2px solid #555; background: #0f1117; box-shadow: 0 4px 16px rgba(0,0,0,0.6);"></canvas>
    </div>
</div>

	<div style="display: flex; justify-content: center; margin: 20px 0;">
             <canvas id="canvas" width="800" height="600" style="border: 2px solid #444; background: #1a1d22; box-shadow: 0 4px 20px rgba(0,0,0,0.5);"></canvas>
        </div>

<!-- Controls area - New Polygon + list on left, other buttons on right -->
    <div class="controls-area" style="display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; margin: 25px 0;">

        <div class="controls">
	    <button onclick="addNewPolygon()">+ New Polygon</button>
            <button onclick="clearCurrentPolygon()">Clear Current</button>
            <button onclick="loadPolygon()">Load CSV</button>
            <button onclick="savePolygon()">Save CSV</button>
          </div>
    </div>

    <div style="margin-top: 20px; display: flex; gap: 10px;">
    <label>Inclination:</label>
    <input type="number" id="inclination" value="60" style="width: 60px;">
    <label>Declination:</label>
    <input type="number" id="declination" value="0" style="width: 60px;">
    <label>Line Orientation:</label>
    <input type="number" id="orientation" value="0" style="width: 60px;">
</div>

	<!-- Left side: New Polygon + list -->
        <div class="polygons-section" style="min-width: 260px;">
	    <h3>Your Polygons</h3>
            <div id="polygons-list" style="max-height: 300px; overflow-y: auto; border: 1px solid #444; border-radius: 6px; padding: 10px; background: #1e2128;"></div>
	    <div style="margin-top: 15px;">
    		<label>Susceptibility:</label><br>
    		<input type="number" id="susceptibility" value="0.01" step="0.001" style="width: 100px;">
	   </div>
        </div>
      


        <div id="image-container" style="display:none; margin-top:20px;">
            <h3>Preview</h3>
            <img id="polygon-image" src="" alt="Polygon Preview">
        </div>

        <div id="points-list">
            <h3>Current Points</h3>
            <ul id="points-ul"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
